name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Development Lua dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Backend protocol and lifecycle fixtures
        run: python -X utf8 -m unittest discover -s codex_source/tests -p "test_*.py"
      - name: Publication scanner fixtures
        run: python -X utf8 -m unittest discover -s tests -p test_publication_check.py
      - name: Release finalizer failure fixtures
        run: python -X utf8 -m unittest discover -s tests -p test_finalize.py
      - name: Node source and local transport fixtures
        run: node tools/run_node_tests.mjs
      - name: CET selector fixtures
        run: python -X utf8 tests/run_cet_lua.py
      - name: Static documentation exports
        run: python -X utf8 write_docs.py --check
      - name: Public source and documentation links
        run: python -X utf8 tools/publication_check.py --root . --strict-links --max-text-bytes 4194304 --json
      - name: Synthetic PowerShell diagnostics on failure
        if: failure()
        run: node tools/diagnose_powershell.mjs
